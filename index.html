<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Calcolatore di sottoreti IP: VLSM, supernetting, suddivisione uguale, configurazione Cisco IOS." />
    <title>Netlab</title>

    <!-- Brand favicon inlined as a data URI: no extra request, no 404 on Pages -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23080d12'/%3E%3Ctext x='32' y='43' font-family='monospace' font-size='27' font-weight='700' fill='%23ffa958' text-anchor='middle'%3E%2F24%3C/text%3E%3C/svg%3E" />

    <!-- Browser chrome follows the app's default (dark) scheme -->
    <meta name="theme-color" content="#080d12" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />

    <!-- Open Graph for shared links -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Netlab" />
    <meta property="og:title" content="Netlab — Calcolatore di sottoreti IPv4" />
    <meta property="og:description" content="VLSM, supernetting, suddivisione uguale, range to CIDR, cloud AWS/Azure, topologia e snippet Cisco IOS." />
    <meta property="og:url" content="https://eliseyrotar.github.io/Netlab/" />

    <!--
      FOUT-prevention: reads saved theme from localStorage and sets data-theme
      on <html> before any stylesheet is parsed, so the first paint uses the
      correct colour scheme without flash. Dark is the default scheme.
    -->
    <script>
      (function () {
        try {
          document.documentElement.dataset.theme =
            localStorage.getItem('netlab_theme') ||
            localStorage.getItem('eli6subnets_theme') || // pre-rename fallback
            'dark';
        } catch (_) {
          // localStorage may be unavailable in some private-browsing contexts.
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
